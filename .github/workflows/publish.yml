name: Publish personal website
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'scripts/build_site.py'
      - 'scripts/build_manuscript.py'
      - '.github/workflows/publish.yml'
  workflow_run:
    workflows: ["Daily citation audit"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publish:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build normalized citation ledger
        run: python generate_report.py
      - name: Build personal homepage
        run: python scripts/build_site.py
      - name: Find the latest manuscript revision
        id: manuscript
        run: git log --first-parent -1 --format=commit=%H -- docs/o/mr_area_revised.tex >> "$GITHUB_OUTPUT"
      - name: Cache manuscript PDFs
        id: manuscript_pdfs
        uses: actions/cache/restore@v4
        with:
          path: .manuscript-pdf
          key: manuscript-pdf-v2-${{ runner.os }}-${{ steps.manuscript.outputs.commit }}
          restore-keys: |
            manuscript-pdf-v2-${{ runner.os }}-
            manuscript-pdf-v1-${{ runner.os }}-
      - name: Install LaTeX
        if: steps.manuscript_pdfs.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends latexdiff texlive-latex-extra texlive-pictures texlive-fonts-recommended lmodern
      - name: Build manuscript archive
        id: manuscript_archive
        run: python scripts/build_manuscript.py
      - name: Save manuscript PDFs
        if: steps.manuscript_pdfs.outputs.cache-hit != 'true' && steps.manuscript_archive.outputs.pdfs_ready == 'true'
        uses: actions/cache/save@v4
        with:
          path: .manuscript-pdf
          key: ${{ steps.manuscript_pdfs.outputs.cache-primary-key }}
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Package personal website
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Wait for deployment package
        env:
          PAGES_ARTIFACT: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          for attempt in {1..12}; do
            count=$(curl --fail --silent --show-error --max-time 20 \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
              | jq --arg name "$PAGES_ARTIFACT" '[.artifacts[] | select(.name == $name and .expired == false)] | length') || count=0
            if [ "$count" = 1 ]; then
              exit 0
            fi
            sleep 5
          done
          echo "Deployment package is not yet visible through the GitHub API."
          exit 1
      - name: Deploy personal website
        id: deploy
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

